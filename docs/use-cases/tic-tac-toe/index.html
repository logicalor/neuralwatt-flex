<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    :root {
      --cell-size: 6rem;
      --gap: 0.5rem;
      --color-x: #2563eb;
      --color-o: #dc2626;
      --color-win: #86efac;
      --bg-page: #f8fafc;
      --text: #0f172a;
      --cell-border: #cbd5e1;
      --cell-bg: #ffffff;
      --cell-hover: #f1f5f9;
      --focus-ring: #93c5fd;
      --win-border: #22c55e;
      --button-bg: #0f172a;
      --button-hover: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-page);
      color: var(--text);
    }

    main {
      text-align: center;
      padding: 1rem;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.75rem;
    }

    #status {
      min-height: 1.5rem;
      margin-bottom: 1rem;
      font-size: 1.125rem;
      font-weight: 600;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, var(--cell-size));
      grid-template-rows: repeat(3, var(--cell-size));
      gap: var(--gap);
      margin: 0 auto 1.5rem;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1;
      background: var(--cell-bg);
      border: 2px solid var(--cell-border);
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .cell:hover:not(:disabled):not(.winning) {
      background: var(--cell-hover);
    }

    .cell:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.x { color: var(--color-x); }
    .cell.o { color: var(--color-o); }
    .cell.winning {
      background: var(--color-win);
      border-color: var(--win-border);
    }

    #new-game {
      padding: 0.6rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--button-bg);
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    #new-game:hover {
      background: var(--button-hover);
    }
  </style>
</head>
<body>
  <main>
    <h1>Tic-Tac-Toe</h1>
    <div id="status" role="status" aria-live="polite">Player X's turn</div>
    <div id="board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </div>
    <button id="new-game" type="button">New game</button>
  </main>

  <script>
    const WINNING_LINES = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    function createGame() {
      const cells = Array(9).fill(null);
      let current = 'X';
      let win = null;
      let line = null;

      function findWinner() {
        for (const [a, b, c] of WINNING_LINES) {
          const mark = cells[a];
          if (mark !== null && cells[b] === mark && cells[c] === mark) {
            win = mark;
            line = [a, b, c];
            return;
          }
        }
        line = null;
        win = null;
      }

      function boardIsFull() {
        return cells.every(cell => cell !== null);
      }

      function board() {
        return cells.slice();
      }

      function currentPlayer() {
        return current;
      }

      function winner() {
        return win;
      }

      function winningLine() {
        return line === null ? null : line.slice();
      }

      function isDraw() {
        return win === null && boardIsFull();
      }

      function makeMove(index) {
        if (index < 0 || index > 8) return false;
        if (cells[index] !== null || win !== null) return false;

        cells[index] = current;
        findWinner();

        if (win === null && !boardIsFull()) {
          current = current === 'X' ? 'O' : 'X';
        }

        return true;
      }

      function reset() {
        cells.fill(null);
        current = 'X';
        win = null;
        line = null;
      }

      return {
        board,
        currentPlayer,
        winner,
        winningLine,
        isDraw,
        makeMove,
        reset
      };
    }

    function initDom(game) {
      const status = document.getElementById('status');
      const boardEl = document.getElementById('board');
      const newGame = document.getElementById('new-game');
      const cellEls = Array.from(boardEl.querySelectorAll('.cell'));

      function updateStatus() {
        const win = game.winner();
        if (win !== null) {
          status.textContent = 'Player ' + win + ' wins';
        } else if (game.isDraw()) {
          status.textContent = 'Game drawn';
        } else {
          status.textContent = "Player " + game.currentPlayer() + "'s turn";
        }
      }

      function render() {
        const state = game.board();
        const win = game.winner();
        const line = game.winningLine();

        cellEls.forEach((cell, index) => {
          const mark = state[index];
          cell.textContent = mark === null ? '' : mark;
          cell.className = 'cell';
          cell.disabled = false;

          if (mark === 'X') {
            cell.classList.add('x');
          } else if (mark === 'O') {
            cell.classList.add('o');
          }

          if (line !== null && line.includes(index)) {
            cell.classList.add('winning');
          }

          cell.setAttribute('aria-label', 'Cell ' + (index + 1) + (mark === null ? ' empty' : ' ' + mark));

          if (win !== null || game.isDraw()) {
            cell.disabled = true;
          }
        });

        updateStatus();
      }

      boardEl.addEventListener('click', function (event) {
        const cell = event.target.closest('.cell');
        if (!cell) return;
        const index = Number(cell.getAttribute('data-index'));
        if (game.makeMove(index)) {
          render();
        }
      });

      newGame.addEventListener('click', function () {
        game.reset();
        render();
      });

      render();
    }

    if (typeof module !== 'undefined' && module.exports) {
      module.exports = { createGame };
    } else if (typeof window !== 'undefined' && typeof document !== 'undefined') {
      window.createGame = createGame;
      document.addEventListener('DOMContentLoaded', function () {
        initDom(createGame());
      });
    }
  </script>
</body>
</html>
